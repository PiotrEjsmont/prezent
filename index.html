<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prezent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .question {
            margin-bottom: 30px;
        }

        .question-text {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: #f8f9fa;
            border: 2px solid transparent;
            padding: 15px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
            text-align: left;
        }

        .option:hover {
            background: #e9ecef;
            border-color: #667eea;
            transform: translateX(5px);
        }

        .progress {
            text-align: center;
            color: #666;
            margin-top: 20px;
            font-size: 0.9em;
        }

        .loading-screen {
            text-align: center;
        }

        .loading-text {
            font-size: 1.2em;
            color: #333;
            margin: 20px 0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            text-align: center;
        }

        .result h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .result p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .concert-link {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1em;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin: 10px 0;
        }

        .concert-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .switch-option {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .switch-button {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .switch-button:hover {
            background: #667eea;
            color: white;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 1.5em;
            }

            .question-text {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="quiz">
            <h1>🎁 Prezent</h1>
            <p class="subtitle">Odpowiadaj intuicyjnie, wkrótce wszystko będzie jasne</p>
            
            <div id="question-container"></div>
            <div class="progress" id="progress"></div>
        </div>

        <div id="loading" class="loading-screen hidden">
            <div class="spinner"></div>
            <div class="loading-text" id="loading-text"></div>
        </div>

        <div id="result" class="result hidden">
            <h2>🎉 Gratulacje!</h2>
            <p>Na podstawie szczegółowej analizy dopasowano idealny prezent imieninowy:</p>
            <a href="" id="concert-link" class="concert-link" target="_blank">Zobacz swój prezent</a>
            
            <div class="switch-option">
                <p style="color: #666; margin-bottom: 15px;">Wolisz drugi wariant?</p>
                <button class="switch-button" id="switch-btn">Pokaż alternatywę</button>
                <div id="alternative-link" class="hidden" style="margin-top: 20px;">
                    <a href="" id="alternative-concert-link" class="concert-link" target="_blank">Zobacz alternatywny prezent</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "Na początek. Kogo wybierasz?:",
                options: ["Michael Jordan", "Pelé"],
                points: [1, 0]
            },
            {
                q: "Strój na wyjście:",
                options: ["Wygodna lniana koszula", "Elegancka marynarka"],
                points: [0, 1]
            },
            {
                q: "Film, który bardziej Cię wciąga:",
                options: ["Dialogi, pauzy, niedopowiedzenia", "Ruch, energia, obraz"],
                points: [1, 0]
            },
            {
                q: "Kolory:",
                options: ["Błękit i zieleń", "Czerń i biel"],
                points: [0, 1]
            },
            {
                q: "Rytm:",
                options: ["Nieregularny, zaskakujący, kanciasty", "Płynny, taneczny, naturalny"],
                points: [1, 0]
            },
            {
                q: "Cisza jest dla Ciebie raczej:",
                options: ["Przerwą", "Przestrzenią"],
                points: [0, 1]
            },
            {
                q: "Bardziej pociąga Cię:",
                options: ["Analiza", "Synteza"],
                points: [1, 0]
            },
            {
                q: "Widok, który bardziej przyciąga:",
                options: ["Jezus w Rio", "Statua Wolności"],
                points: [0, 1]
            },
            {
                q: "Instrument:",
                options: ["Pianino", "Gitara"],
                points: [1, 0]
            }
        ];

        const loadingMessages = [
            "Analiza profilu psychologicznego...",
            "Ocena poglądów politycznych...",
            "Szacowanie wieku i długości włosów...",
            "Weryfikacja gustów kulinarnych...",
            "Sprawdzanie historii przeglądania...",
            "Konsultacja z ekspertami...",
            "Analiza fazy księżyca...",
            "Finalizacja wyników..."
        ];

        const concertA = "https://jassmine.com/concert/tymon-tymanski-yasstet-cmonk/";
        const concertB = "https://jassmine.com/concert/fabiano-do-nascimento/";

        let currentQuestion = 0;
        let score = 0;

        function showQuestion() {
            const container = document.getElementById('question-container');
            const progress = document.getElementById('progress');
            
            if (currentQuestion >= questions.length) {
                showLoading();
                return;
            }

            const q = questions[currentQuestion];
            
            container.innerHTML = `
                <div class="question">
                    <div class="question-text">${q.q}</div>
                    <div class="options">
                        ${q.options.map((opt, i) => 
                            `<div class="option" onclick="selectAnswer(${i})">${opt}</div>`
                        ).join('')}
                    </div>
                </div>
            `;
            
            progress.textContent = `Pytanie ${currentQuestion + 1} z ${questions.length}`;
        }

        function selectAnswer(index) {
            score += questions[currentQuestion].points[index];
            currentQuestion++;
            showQuestion();
        }

        function showLoading() {
            document.getElementById('quiz').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
            
            let messageIndex = 0;
            const loadingText = document.getElementById('loading-text');
            
            const interval = setInterval(() => {
                if (messageIndex < loadingMessages.length) {
                    loadingText.textContent = loadingMessages[messageIndex];
                    messageIndex++;
                } else {
                    clearInterval(interval);
                    showResult();
                }
            }, 1250);
        }

        function showResult() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('result').classList.remove('hidden');
            
            const resultConcert = score >= 5 ? concertA : concertB;
            const alternativeConcert = score >= 5 ? concertB : concertA;
            
            document.getElementById('concert-link').href = resultConcert;
            document.getElementById('alternative-concert-link').href = alternativeConcert;
        }

        document.getElementById('switch-btn').addEventListener('click', function() {
            document.getElementById('alternative-link').classList.remove('hidden');
            this.style.display = 'none';
        });

        // Start quiz
        showQuestion();
    </script>
</body>
</html>
